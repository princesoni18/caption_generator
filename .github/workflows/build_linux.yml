name: Build Linux App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libnotify-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libpulse-dev libasound2-dev build-essential

    - name: Install Project Dependencies
      run: |
        flutter pub upgrade
        flutter pub get

    - name: Build Linux Release Bundle
      run: flutter build linux --release

    - name: Package for Distribution
      run: |
        cd build/linux/x64/release/bundle
        tar -czvf ../../../../../caption_generator_linux.tar.gz *

    - name: Upload Linux Tarball Artifact (.tar.gz)
      uses: actions/upload-artifact@v5
      with:
        name: caption_generator_linux_tarball
        path: caption_generator_linux.tar.gz

    - name: Upload Linux Bundle Directory Artifact
      uses: actions/upload-artifact@v5
      with:
        name: caption_generator_linux_folder
        path: build/linux/x64/release/bundle/
